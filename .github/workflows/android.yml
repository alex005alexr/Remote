name: Android build

on:
  push:
    branches: [main, desarrollo, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      REMOTE_KEYSTORE_BASE64: ${{ secrets.REMOTE_KEYSTORE_BASE64 }}
      REMOTE_STORE_PASSWORD: ${{ secrets.REMOTE_STORE_PASSWORD }}
      REMOTE_KEY_ALIAS: ${{ secrets.REMOTE_KEY_ALIAS }}
      REMOTE_KEY_PASSWORD: ${{ secrets.REMOTE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Add Android SDK tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure persistent app signing
        if: ${{ env.REMOTE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$REMOTE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/remote-release.jks"
          echo "REMOTE_KEYSTORE_PATH=$RUNNER_TEMP/remote-release.jks" >> "$GITHUB_ENV"

      - name: Build signed update APK
        if: ${{ env.REMOTE_KEYSTORE_BASE64 != '' }}
        run: gradle assembleRelease

      - name: Build temporary debug APK (until signing key is configured)
        if: ${{ env.REMOTE_KEYSTORE_BASE64 == '' }}
        run: gradle assembleDebug

      - name: Upload signed update APK
        if: ${{ env.REMOTE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Remote-update-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload temporary debug APK
        if: ${{ env.REMOTE_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Remote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14